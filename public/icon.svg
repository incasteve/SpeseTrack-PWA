<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />

  <!-- Inner glowing circle / safe-zone graphic -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#shadow)">
    <!-- Main Card / Wallet shape -->
    <rect x="56" y="100" width="400" height="280" rx="44" fill="#ffffff" fill-opacity="0.95" />
    <path d="M56 180 H456" stroke="#e0f2fe" stroke-width="14" stroke-linecap="round" />
    
    <!-- Chip / Security emblem -->
    <rect x="100" y="130" width="52" height="36" rx="8" fill="url(#accent)" />
    
    <!-- Analytics / Trend bars representing expense tracking -->
    <rect x="120" y="270" width="36" height="70" rx="8" fill="#38bdf8" />
    <rect x="180" y="230" width="36" height="110" rx="8" fill="#0284c7" />
    <rect x="240" y="200" width="36" height="140" rx="8" fill="#0d9488" />
    <rect x="300" y="250" width="36" height="90" rx="8" fill="#10b981" />
    
    <!-- Dynamic trend sparkline -->
    <path d="M138 260 L198 220 L258 190 L318 240 L378 170" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="378" cy="170" r="10" fill="#f59e0b" />
    
    <!-- Small Google Drive sync pill badge -->
    <g transform="translate(360, 115) scale(0.9)">
      <circle cx="20" cy="20" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3" />
      <!-- Tiny stylized Drive triangles -->
      <polygon points="20,8 10,25 30,25" fill="#f59e0b" opacity="0.9" />
      <polygon points="10,25 20,40 5,32" fill="#10b981" opacity="0.9" />
      <polygon points="30,25 20,40 35,32" fill="#3b82f6" opacity="0.9" />
    </g>
  </g>
</svg>
